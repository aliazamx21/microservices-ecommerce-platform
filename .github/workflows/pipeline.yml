name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # We now tell Maven exactly which pom.xml to build using the -f flag
      - name: Build Eureka Server with Maven
        run: mvn -f eureka-server/pom.xml clean package -DskipTests

      - name: Build API Gateway with Maven
        run: mvn -f api-gateway/pom.xml clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Eureka Server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest ./eureka-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest

      - name: Build and Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest