name: Microservices CI/CD Pipeline

# This tells GitHub to run this pipeline every time you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # This is the free GitHub cloud server

    steps:
      # 1. Grab your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install Java 17 on the cloud server
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Compile all your Spring Boot microservices
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Log into your Docker Hub account securely
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and Push Eureka Server
      - name: Build and Push Eureka Server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest ./eureka-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest

      # 6. Build and Push API Gateway
      - name: Build and Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest