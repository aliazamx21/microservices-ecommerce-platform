name: Infrastructure Provisioning (Terraform)

on:
  push:
    branches: [ main ]
    paths: [ 'terraform/**' ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster

      # --- 1. THE CONFIGMAP (Dynamic URLs) ---
      - name: Inject Infrastructure Config to Kubernetes
        run: |
          cd terraform
          # 1. Grab the dynamic outputs from Terraform
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          
          # 2. Create or update a ConfigMap in EKS with these exact values
          kubectl create configmap infra-config \
            --from-literal=DB_ENDPOINT=$RDS_ENDPOINT \
            --from-literal=S3_BUCKET_NAME=$S3_BUCKET \
            -o yaml --dry-run=client | kubectl apply -f -

      # --- 2. THE SECRETS VAULT (Passwords & API Keys) ---
      - name: Inject GitHub Secrets to Kubernetes
        run: |
          kubectl create secret generic ecommerce-secrets \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -