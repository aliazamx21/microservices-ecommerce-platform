name: Pipeline Deploy

on:
  workflow_call:
    inputs:
      service_name:
        description: "The name of the microservice folder"
        required: true
        type: string
    # We must explicitly require these secrets so this reusable workflow can see them
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      DB_PASSWORD:
        required: true
      STRIPE_SECRET_KEY:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          if [ -f "${{ inputs.service_name }}/pom.xml" ]; then
            mvn -f ${{ inputs.service_name }}/pom.xml clean package -DskipTests
          else
            mvn -f ${{ inputs.service_name }}/${{ inputs.service_name }}/pom.xml clean package -DskipTests
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          if [ -f "${{ inputs.service_name }}/Dockerfile" ]; then
            BUILD_PATH="./${{ inputs.service_name }}"
          else
            BUILD_PATH="./${{ inputs.service_name }}/${{ inputs.service_name }}"
          fi
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest $BUILD_PATH
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster

      - name: Create or Update Kubernetes Secrets
        run: |
          kubectl create secret generic ecommerce-secrets \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install or Upgrade Kafka (Zero Manual Setup)
        run: |
          helm upgrade --install kafka oci://registry-1.docker.io/bitnamicharts/kafka --set controller.persistence.enabled=false --wait || true

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment ${{ inputs.service_name }}-deployment