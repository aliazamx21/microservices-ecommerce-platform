name: Pipeline Deploy

on:
  workflow_call:
    inputs:
      service_name:
        description: "The name of the microservice folder"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          if [ -f "${{ inputs.service_name }}/pom.xml" ]; then
            mvn -f ${{ inputs.service_name }}/pom.xml clean package -DskipTests
          else
            mvn -f ${{ inputs.service_name }}/${{ inputs.service_name }}/pom.xml clean package -DskipTests
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          if [ -f "${{ inputs.service_name }}/Dockerfile" ]; then
            BUILD_PATH="./${{ inputs.service_name }}"
          else
            BUILD_PATH="./${{ inputs.service_name }}/${{ inputs.service_name }}"
          fi
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest $BUILD_PATH
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster

      - name: Deploy Specific Microservice to EKS (Skips if identical)
        run: |
          kubectl apply -f k8s/${{ inputs.service_name }}.yaml
          kubectl rollout restart deployment ${{ inputs.service_name }}-deployment || true