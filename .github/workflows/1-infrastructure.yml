name: 1-infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/aws/**"
      - "terraform/gcp/**"
      - "terraform/azure/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # AWS
  # ============================================================
  aws-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/aws
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/aws
        run: |
          terraform apply \
            -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Update Kubeconfig for AWS EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name ecommerce-cluster

      - name: Inject Infrastructure Config to EKS
        working-directory: terraform/aws
        run: |
          kubectl create configmap infra-config \
            --from-literal=DB_ENDPOINT="$(terraform output -raw rds_endpoint)" \
            --from-literal=S3_BUCKET_NAME="$(terraform output -raw s3_bucket_name)" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Inject Application Secrets to EKS
        run: |
          kubectl create secret generic ecommerce-secrets \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create Docker Hub Secret in EKS
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

  # ============================================================
  # GCP
  # ============================================================
  gcp-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/gcp
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/gcp
        run: |
          terraform apply \
            -auto-approve \
            -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"

      - name: Update Kubeconfig for GKE
        run: |
          gcloud container clusters get-credentials ecom-ai-cluster \
            --region asia-south1

      - name: Inject Application Secrets to GKE
        run: |
          kubectl create secret generic ecommerce-secrets \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

  # ============================================================
  # AZURE
  # ============================================================
  azure-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/azure
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/azure
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform apply -auto-approve

      - name: Update Kubeconfig for AKS
        run: |
          az aks get-credentials \
            --resource-group ecom-devops-rg \
            --name ecom-devops-aks \
            --overwrite-existing

      - name: Inject Application Secrets to AKS
        run: |
          kubectl create secret generic ecommerce-secrets \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -