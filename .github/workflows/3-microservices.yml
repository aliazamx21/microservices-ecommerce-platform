name: 3-microservices-deploy

on:
  workflow_run:
    workflows: ["2-devops-tools"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'api-gateway/**'
      - 'authservice/**'
      - 'cart-service/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'product-service/**'
      - 'ai-mcp-client/**'
      - 'ai-mcp-sandbox/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    outputs:
      changed_services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for modified files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            authservice: 'authservice/**'
            cart-service: 'cart-service/**'
            order-service: 'order-service/**'
            payment-service: 'payment-service/**'
            product-service: 'product-service/**'
            ai-mcp-client: 'ai-mcp-client/**'
            ai-mcp-sandbox: 'ai-mcp-sandbox/**'

  build-and-deploy:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed_services != '[]' && needs.detect-changes.outputs.changed_services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_name: ${{ fromJSON(needs.detect-changes.outputs.changed_services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          SERVICE_PATH="${{ matrix.service_name }}"
          [ -f "$SERVICE_PATH/pom.xml" ] || SERVICE_PATH="$SERVICE_PATH/$SERVICE_PATH"
          mvn -f "$SERVICE_PATH/pom.xml" clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          SERVICE_PATH="${{ matrix.service_name }}"
          [ -f "$SERVICE_PATH/Dockerfile" ] || SERVICE_PATH="$SERVICE_PATH/$SERVICE_PATH"
          
          if [ "${{ matrix.service_name }}" == "ai-mcp-client" ] || [ "${{ matrix.service_name }}" == "ai-mcp-sandbox" ]; then
            IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/ecom-platform:${{ matrix.service_name }}"
          else
            IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-platform:${{ matrix.service_name }}"
          fi
          
          docker build -t "$IMAGE_TAG" "$SERVICE_PATH"
          docker push "$IMAGE_TAG"

      # --- AWS DEPLOYMENT FOR STANDARD MICROSERVICES ---
      - name: Configure AWS Credentials
        if: ${{ matrix.service_name != 'ai-mcp-client' && matrix.service_name != 'ai-mcp-sandbox' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Kubeconfig & Deploy to EKS (Standard Microservices)
        if: ${{ matrix.service_name != 'ai-mcp-client' && matrix.service_name != 'ai-mcp-sandbox' }}
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster
          kubectl apply -f k8s/microservices/${{ matrix.service_name }}.yaml
          kubectl rollout restart deployment ${{ matrix.service_name }}-deployment || true

      # --- GCP DEPLOYMENT FOR AI MICROSERVICES ---
      - name: Authenticate to GCP (AI Services)
        if: ${{ matrix.service_name == 'ai-mcp-client' || matrix.service_name == 'ai-mcp-sandbox' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud
        if: ${{ matrix.service_name == 'ai-mcp-client' || matrix.service_name == 'ai-mcp-sandbox' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Update Kubeconfig & Deploy to GKE (AI Services)
        if: ${{ matrix.service_name == 'ai-mcp-client' || matrix.service_name == 'ai-mcp-sandbox' }}
        run: |
          gcloud container clusters get-credentials ecom-ai-cluster --region asia-south1
          kubectl apply -f k8s/microservices/${{ matrix.service_name }}.yaml
          kubectl rollout restart deployment ${{ matrix.service_name }}-deployment || true