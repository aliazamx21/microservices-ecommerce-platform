name: Deploy DevOps Tools

on:
  push:
    branches:
      - main
    paths:
      - 'devops-tools/**' # Only runs if you change a tool configuration

jobs:
  deploy-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster

      - name: Deploy Kubernetes Manifests (Zipkin, SonarQube, ELK)
        run: kubectl apply -f devops-tools/

      - name: Install Helm Charts (Kafka, Prometheus, Grafana)
        run: bash devops-tools/install-heavy-tools.sh