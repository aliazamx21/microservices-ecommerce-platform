name: Destroy Infrastructure and Images

on:
  workflow_dispatch: # Allows manual trigger ONLY

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. DELETE DOCKER HUB IMAGES ---
      - name: Delete all repositories from Docker Hub
        env:
          # CORRECTED: Matching the exact names from your GitHub Secrets
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Authenticating with Docker Hub..."
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKER_USER\", \"password\": \"$DOCKER_PASS\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to authenticate with Docker Hub."
            exit 1
          fi

          echo "Fetching all repositories for user $DOCKER_USER..."
          REPOS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USER}/?page_size=100" | jq -r '.results[].name')

          for REPO in $REPOS; do
            echo "Deleting repository: $DOCKER_USER/$REPO..."
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$DOCKER_USER/$REPO/"
          done
          echo "Docker Hub cleanup complete."

      # --- 2. DELETE KUBERNETES RESOURCES ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster || true

      - name: Delete Kubernetes Resources
        run: |
          kubectl delete -f k8s/ --ignore-not-found=true || true
          kubectl delete -f devops-tools/ --ignore-not-found=true || true
          helm uninstall kafka --ignore-not-found || true
          helm uninstall monitoring --namespace monitoring --ignore-not-found || true
          # Note: Added a sleep to give AWS time to detach LoadBalancers/Volumes before TF destroys the VPC
          sleep 60 

      # --- 3. DESTROY AWS INFRASTRUCTURE ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Destroy
        run: |
          cd terraform
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"