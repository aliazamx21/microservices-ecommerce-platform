name: destroy

on:
  workflow_dispatch:

jobs:
  destroy-all-clouds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. CLOUD CREDENTIALS SETUP ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --- 2. TEARDOWN K8S LOAD BALANCERS BEFORE TERRAFORM ---
      - name: Clean up Azure AKS Services
        run: |
          az aks get-credentials --resource-group ecom-devops-rg --name ecom-devops-aks || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true

      - name: Clean up AWS EKS Services
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true

      - name: Clean up GCP GKE Services
        run: |
          gcloud container clusters get-credentials ecom-ai-cluster --region asia-south1 || true
          kubectl delete svc --all --all-namespaces --ignore-not-found=true

      # --- 3. DESTROY TERRAFORM INFRASTRUCTURE ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Destroy Azure Infrastructure
        run: |
          cd terraform/azure
          terraform init
          terraform destroy -auto-approve

      - name: Destroy AWS Infrastructure
        run: |
          cd terraform/aws
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Destroy GCP Infrastructure
        run: |
          cd terraform/gcp
          terraform init
          terraform destroy -auto-approve -var="gcp_project_id=${{ secrets.GCP_PROJECT_ID }}"