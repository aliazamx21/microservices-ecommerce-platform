name: Destroy Infrastructure

on:
  workflow_dispatch: # Allows manual trigger ONLY

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ap-south-1 --name ecommerce-cluster || true

      - name: Delete Kubernetes Resources
        run: |
          kubectl delete -f k8s/ --ignore-not-found=true || true
          kubectl delete -f devops-tools/ --ignore-not-found=true || true
          helm uninstall kafka --ignore-not-found || true
          helm uninstall monitoring --namespace monitoring --ignore-not-found || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Destroy
        run: |
          cd terraform
          terraform init
          terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"