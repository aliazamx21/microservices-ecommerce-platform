spring.application.name=api-gateway
server.port=6969

# ==========================================
# SECURITY & IDENTITY
# ==========================================
jwt.secret=${JWT_SECRET:fallback-secret-key-for-local-development-only-12345}

# ==========================================
# EUREKA REGISTRATION (Kubernetes Cluster)
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

# ==========================================
# SPRING CLOUD GATEWAY ROUTES (Using K8s DNS)
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://product-service:8082
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/product/**

spring.cloud.gateway.server.webflux.routes[1].id=cart-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://cart-service:8083
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/cart/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://order-service:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://payment-service:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/payments/**

spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://authservice:8086
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/auth/**
# NOTE: If your individual microservices run on a port other than 8080
# (like 8081, 8082), update the port numbers above to match!

# ==========================================
# OBSERVABILITY (Actuator & Zipkin)
# ==========================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
# CHANGED: Pointing to K8s Zipkin service instead of localhost
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true