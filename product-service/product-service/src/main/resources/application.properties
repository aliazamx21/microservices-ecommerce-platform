spring.application.name=product-service
server.port=8082

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
# CHANGED: Uses environment variables injected by Kubernetes
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/product_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# AWS S3 CONFIGURATION
# ==========================================
# CHANGED: Parameterized with environment variables so Kubernetes can inject them securely
# without hardcoding secrets in your repository.
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:your-ecommerce-bucket-name}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID:YOUR_ACCESS_KEY}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:YOUR_SECRET_KEY}

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# EUREKA DISCOVERY (Disabled for Kubernetes)
# ==========================================
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

# ==========================================
# OBSERVABILITY
# ==========================================
# CHANGED: Enabled tracing and pointed to K8s Zipkin
management.tracing.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true