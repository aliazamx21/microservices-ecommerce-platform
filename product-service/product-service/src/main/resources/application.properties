spring.application.name=product-service

# Server
server.port=8082

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#AWS
aws.s3.bucket.name:your-ecommerce-bucket-name
aws.s3.region:us-east-1
aws.credentials.access-key:YOUR_ACCESS_KEY
aws.credentials.secret-key:YOUR_SECRET_KEY

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Eureka Instance
eureka.instance.prefer-ip-address=true