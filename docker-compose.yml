version: '3.8'

services:
  # -----------------------------------
  # 1. DATABASES & VECTOR STORES
  # -----------------------------------
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=payment_db
    ports:
      - "3306:3306"

  kafka:
    image: apache/kafka:latest
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"

  # -----------------------------------
  # 2. DEVOPS & MONITORING TOOLS
  # -----------------------------------
  eureka:
    image: aliaz333/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ecommerce-zipkin
    ports:
      - "9411:9411"

  spring-boot-admin:
    image: aliaz333/admin-server:latest
    container_name: spring-boot-admin
    ports:
      - "8087:8087"

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    ports:
      - "9000:9000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # -----------------------------------
  # 3. AI MCP SERVICES
  # -----------------------------------
  ai-mcp-sandbox:
    image: aliaz333/ecom-platform:ai-mcp-sandbox
    container_name: ai-mcp-sandbox
    ports:
      - "8080:8080"

  ai-mcp-client:
    image: aliaz333/ecom-platform:ai-mcp-client
    container_name: ai-mcp-client
    ports:
      - "8081:8081"
    environment:
      - MCP_SERVER_URL=http://ai-mcp-sandbox:8080
      - GEMINI_API_KEY=your_gemini_api_key_here
      - SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL=gemini-1.5-flash
    depends_on:
      - ai-mcp-sandbox

  # -----------------------------------
  # 4. YOUR MICROSERVICES
  # -----------------------------------
  api-gateway:
    image: aliaz333/api-gateway:latest
    container_name: api-gateway
    ports:
      - "6969:6969"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - JWT_SECRET=my-super-secret-local-dev-key-12345
    depends_on:
      - zipkin
      - eureka

  auth-service:
    image: aliaz333/authservice:latest
    container_name: auth-service
    ports:
      - "8086:8086"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=test
      - JWT_SECRET=my-super-secret-local-dev-key-12345
    depends_on:
      - mysql
      - eureka

  cart-service:
    image: aliaz333/cart-service:latest
    container_name: cart-service
    ports:
      - "8083:8083"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=test
    depends_on:
      - mysql
      - eureka

  order-service:
    image: aliaz333/order-service:latest
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=test
      - KAFKA_URL=kafka:9092
    depends_on:
      - mysql
      - kafka
      - eureka

  payment-service:
    image: aliaz333/payment-service:latest
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=test
      - KAFKA_URL=kafka:9092
      - STRIPE_SECRET_KEY=sk_test_mock_key_for_local_dev
      - STRIPE_WEBHOOK_SECRET=whsec_mock_key_for_local_dev
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mysql
      - kafka
      - eureka

  product-service:
    image: aliaz333/product-service:latest
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=test
      - AWS_REGION=ap-south-1
      - AWS_S3_BUCKET_NAME=local-mock-bucket
      - AWS_ACCESS_KEY_ID=mock_access_key
      - AWS_SECRET_ACCESS_KEY=mock_secret_key
      - GEMINI_API_KEY=your_gemini_api_key_here
    depends_on:
      - mysql
      - eureka