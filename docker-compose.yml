services:
  version: '3.8'

  services:
    # -----------------------------------
    # 1. INFRASTRUCTURE & TOOLS
    # -----------------------------------
    mysql:
      image: mysql:8.0
      container_name: ecommerce-mysql
      environment:
        - MYSQL_ROOT_PASSWORD=test
        - MYSQL_DATABASE=payment_db
      ports:
        - "3306:3306"

    zipkin:
      image: openzipkin/zipkin:latest
      container_name: ecommerce-zipkin
      ports:
        - "9411:9411"

    kafka:
      image: bitnami/kafka:latest
      container_name: ecommerce-kafka
      environment:
        - KAFKA_CFG_NODE_ID=0
        - KAFKA_CFG_PROCESS_ROLES=controller,broker
        - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
        - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
        - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      ports:
        - "9092:9092"

    # -----------------------------------
    # 2. YOUR MICROSERVICES (Pulled from Docker Hub)
    # -----------------------------------
    api-gateway:
      image: aliaz333/api-gateway:latest
      container_name: api-gateway
      ports:
        - "6969:6969"
      environment:
        - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      depends_on:
        - zipkin

    auth-service:
      image: aliaz333/authservice:latest
      container_name: auth-service
      environment:
        - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true
        - SPRING_DATASOURCE_USERNAME=root
        - SPRING_DATASOURCE_PASSWORD=test
      depends_on:
        - mysql

    cart-service:
      image: aliaz333/cart-service:latest
      container_name: cart-service
      environment:
        - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cart_db?createDatabaseIfNotExist=true
        - SPRING_DATASOURCE_USERNAME=root
        - SPRING_DATASOURCE_PASSWORD=test
      depends_on:
        - mysql

    order-service:
      image: aliaz333/order-service:latest
      container_name: order-service
      environment:
        - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true
        - SPRING_DATASOURCE_USERNAME=root
        - SPRING_DATASOURCE_PASSWORD=test
        - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      depends_on:
        - mysql
        - kafka

    product-service:
      image: aliaz333/product-service:latest
      container_name: product-service
      environment:
        - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/product_db?createDatabaseIfNotExist=true
        - SPRING_DATASOURCE_USERNAME=root
        - SPRING_DATASOURCE_PASSWORD=test
      depends_on:
        - mysql