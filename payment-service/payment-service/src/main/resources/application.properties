spring.application.name=payment-service
server.port=8085

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# STRIPE API KEYS
# ==========================================
stripe.api.secret-key=${STRIPE_SECRET_KEY}
stripe.api.publishable-key=pk_test_51RbEFUQPFGn7LEWF19P5CgsAAQWym9pBlSx16O6AZUnePD0gQ1Dy3A3g8ezAnkDk5h5o6gOVK73WYBXZW1t3DcSs00WfN7QwIb

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# EUREKA & SPRING BOOT ADMIN REGISTRATION
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

# Allows Spring Boot Admin server to discover this service inside Kubernetes
spring.boot.admin.client.instance.service-url=http://payment-service:8085
spring.boot.admin.client.url=http://spring-boot-admin-service:8087

# ==========================================
# OBSERVABILITY & MANAGEMENT
# ==========================================
management.server.port=8085
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true