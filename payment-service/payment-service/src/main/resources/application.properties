spring.application.name=payment-service
server.port=8085

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
# CHANGED: Uses environment variables injected by Kubernetes
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# STRIPE API KEYS
# ==========================================
stripe.api.secret-key=${STRIPE_SECRET_KEY}
stripe.api.publishable-key=pk_test_51RbEFUQPFGn7LEWF19P5CgsAAQWym9pBlSx16O6AZUnePD0gQ1Dy3A3g8ezAnkDk5h5o6gOVK73WYBXZW1t3DcSs00WfN7QwIb

# ==========================================
# AWS (Left commented out as per your original file)
# ==========================================
#aws.s3.bucket.name:your-ecommerce-bucket-name
#aws.s3.region:us-east-1
#aws.credentials.access-key:YOUR_ACCESS_KEY
#aws.credentials.secret-key:YOUR_SECRET_KEY

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# EUREKA DISCOVERY (Disabled for Kubernetes)
# ==========================================
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

# ==========================================
# OBSERVABILITY
# ==========================================
# CHANGED: Enabled tracing and pointed to K8s Zipkin
management.tracing.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true