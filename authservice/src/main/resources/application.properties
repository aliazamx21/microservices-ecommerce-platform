# Application & Server config
spring.application.name=auth-service
server.port=8086

# ==========================================
# SECURITY & IDENTITY
# ==========================================
# MUST MATCH THE API GATEWAY EXACTLY
jwt.secret=${JWT_SECRET:fallback-secret-key-for-local-development-only-12345}

# ==========================================
# EUREKA REGISTRATION (Kubernetes Cluster)
# ==========================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
# CHANGED: Uses environment variables injected by your Kubernetes/Terraform pipeline
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# OBSERVABILITY
# ==========================================
# CHANGED: Enabled tracing so Zipkin can actually track your requests
management.tracing.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
# CHANGED: Pointing to K8s Zipkin service
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true