spring.application.name=cart-service
server.port=8083

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
# CHANGED: Uses environment variables injected by Kubernetes
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cart_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# AWS (Left commented out as per your original file)
# ==========================================
#aws.s3.bucket.name:your-ecommerce-bucket-name
#aws.s3.region:ap-south-1
#aws.credentials.access-key:YOUR_ACCESS_KEY
#aws.credentials.secret-key:YOUR_SECRET_KEY

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# EUREKA DISCOVERY (Disabled for Kubernetes)
# ==========================================
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false

# ==========================================
# OBSERVABILITY
# ==========================================
# CHANGED: Enabled tracing and pointed to K8s Zipkin
management.tracing.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.prometheus.metrics.export.enabled=true